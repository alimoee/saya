name: Ali2 Daily Marketing
on:
  schedule:
    - cron: '30 5 * * *'   # ۹:۰۰ صبح به وقت تهران
  workflow_dispatch:        # دکمه اجرای دستی

jobs:
  ali2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - run: python scripts/ali2_run.py
        env:
          TG_TOKEN:  ${{ secrets.TG_TOKEN }}
          TG_CHAT:   ${{ secrets.TG_CHAT }}
          SITE_URL:  ${{ secrets.SITE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
      - name: ثبت وضعیت (Audit Log)
        run: |
          git config user.name "Ali2 Bot"
          git config user.email "ali2@bot.local"
          git add campaign.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Ali2 daily $(date +%F)"
          git push